<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OLED Studio</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#090d12;
    color:white;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}


/* HEADER */

.header{
    background:#151c25;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
    text-align:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.subtitle{
    color:#9da8b8;
    margin-top:8px;
}

.status{
    margin-top:15px;
    font-weight:bold;
}

#statusText{
    color:#ffaa00;
}


/* CARDS */

.card{
    background:#151c25;
    border-radius:20px;
    padding:22px;
    margin-bottom:18px;
}

.card h2{
    margin-bottom:10px;
}

.card p{
    color:#9da8b8;
    margin-bottom:15px;
}


/* INPUT */

input{
    width:100%;
    padding:14px;

    background:#090d12;
    color:white;

    border:1px solid #394554;
    border-radius:10px;

    font-size:16px;

    margin-bottom:12px;
}


/* BUTTONS */

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

button{
    border:none;
    border-radius:10px;

    padding:13px 18px;

    color:white;
    background:#2563eb;

    cursor:pointer;

    font-size:15px;
    font-weight:bold;
}

button:hover{
    opacity:.85;
}

.heart{
    background:#e11d48;
}

.about{
    background:#7c3aed;
}

.drawButton{
    background:#059669;
}

.clearButton{
    background:#dc2626;
}

.sendButton{
    background:#16a34a;
}


/* DRAWING */

#drawArea{
    display:none;
    margin-top:20px;
}

.canvasContainer{
    width:100%;
    display:flex;
    justify-content:center;
}

#drawCanvas{

    width:100%;
    max-width:640px;

    height:auto;

    background:black;

    border:3px solid #596575;

    border-radius:10px;

    cursor:crosshair;

    touch-action:none;

    image-rendering:pixelated;
}

.drawControls{
    margin-top:15px;

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:8px;
}

.drawStatus{
    text-align:center;

    margin-top:12px;

    color:#9da8b8;
}


/* LOG */

.log{
    background:#080b0f;

    border-radius:10px;

    padding:12px;

    height:140px;

    overflow-y:auto;

    font-family:monospace;

    font-size:13px;

    color:#a7f3d0;
}


/* FOOTER */

.footer{
    text-align:center;

    color:#687384;

    margin-top:20px;

    font-size:13px;
}


/* MOBILE */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .logo{
        font-size:25px;
    }

    button{
        width:100%;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- ================================= -->
<!-- HEADER -->
<!-- ================================= -->

<div class="header">

    <div class="logo">
        📺 OLED STUDIO
    </div>

    <div class="subtitle">
        ESP8266 + MQTT OLED Controller
    </div>

    <div class="status">

        MQTT STATUS:

        <span id="statusText">
            CONNECTING...
        </span>

    </div>

</div>



<!-- ================================= -->
<!-- TEXT -->
<!-- ================================= -->

<div class="card">

    <h2>📝 Display Text</h2>

    <p>
        Enter text and send it to the OLED.
    </p>


    <input
        type="text"
        id="textInput"
        maxlength="80"
        placeholder="Enter text here..."
    >


    <div class="buttons">

        <button onclick="sendText()">
            📺 SHOW TEXT
        </button>


        <button
            class="heart"
            onclick="sendHeart()">

            ❤️ HEART

        </button>


        <button
            class="about"
            onclick="sendAbout()">

            👤 WHO INVENTED?

        </button>

    </div>

</div>



<!-- ================================= -->
<!-- DRAW -->
<!-- ================================= -->

<div class="card">

    <h2>🎨 Drawing</h2>

    <p>
        Draw anything and send it to the 128 × 64 OLED.
    </p>


    <button
        class="drawButton"
        onclick="openDrawing()">

        ✏️ OPEN DRAWING

    </button>



    <div id="drawArea">


        <div class="canvasContainer">

            <canvas
                id="drawCanvas"
                width="128"
                height="64">
            </canvas>

        </div>



        <div class="drawControls">

            <button
                class="clearButton"
                onclick="clearCanvas()">

                🗑️ CLEAR

            </button>


            <button
                class="sendButton"
                onclick="sendDrawing()">

                📺 SEND TO OLED

            </button>

        </div>



        <div
            class="drawStatus"
            id="drawStatus">

            Ready to draw

        </div>


    </div>

</div>



<!-- ================================= -->
<!-- MQTT LOG -->
<!-- ================================= -->

<div class="card">

    <h2>📡 MQTT LOG</h2>


    <div
        class="log"
        id="log">

        Starting...

    </div>

</div>



<div class="footer">

    OLED Studio • Developed by Sangeeth Varma

</div>


</div>



<script>


// ==================================================
// MQTT SETTINGS
// ==================================================

const MQTT_URL =
    "wss://broker.emqx.io:8084/mqtt";


const MQTT_TOPIC =
    "sangeeth/oled-studio/test";


// ==================================================
// MQTT CLIENT ID
// ==================================================

const clientId =
    "OLED_WEB_" +
    Math.random()
        .toString(16)
        .substring(2,10);


// ==================================================
// MQTT CONNECTION
// ==================================================

const client =
    mqtt.connect(

        MQTT_URL,

        {
            clientId:clientId,

            clean:true,

            connectTimeout:10000,

            reconnectPeriod:3000
        }

    );


// ==================================================
// ELEMENTS
// ==================================================

const statusText =
    document.getElementById(
        "statusText"
    );


const logBox =
    document.getElementById(
        "log"
    );


// ==================================================
// LOG
// ==================================================

function log(message){

    const time =
        new Date()
        .toLocaleTimeString();


    logBox.innerHTML +=
        "<br>[" +
        time +
        "] " +
        message;


    logBox.scrollTop =
        logBox.scrollHeight;

}


// ==================================================
// MQTT CONNECTED
// ==================================================

client.on(
    "connect",

    function(){

        statusText.innerText =
            "ONLINE";


        statusText.style.color =
            "#22c55e";


        log(
            "MQTT connected"
        );


        client.subscribe(

            MQTT_TOPIC,

            function(error){

                if(error){

                    log(
                        "Subscribe error"
                    );

                }
                else{

                    log(
                        "Subscribed: " +
                        MQTT_TOPIC
                    );

                }

            }

        );

    }

);


// ==================================================
// MQTT ERROR
// ==================================================

client.on(
    "error",

    function(error){

        statusText.innerText =
            "ERROR";


        statusText.style.color =
            "#ef4444";


        log(
            "MQTT error"
        );

    }

);


// ==================================================
// MQTT OFFLINE
// ==================================================

client.on(
    "offline",

    function(){

        statusText.innerText =
            "OFFLINE";


        statusText.style.color =
            "#ef4444";


        log(
            "MQTT offline"
        );

    }

);


// ==================================================
// MQTT MESSAGE
// ==================================================

client.on(

    "message",

    function(topic,message){

        log(
            "Received: " +
            message.toString()
        );

    }

);


// ==================================================
// PUBLISH
// ==================================================

function publishMessage(message){

    if(!client.connected){

        alert(
            "MQTT is not connected!"
        );

        return;

    }


    client.publish(

        MQTT_TOPIC,

        message,

        {
            qos:0
        },

        function(error){

            if(error){

                log(
                    "Publish error"
                );

            }
            else{

                log(
                    "Sent: " +
                    message.substring(
                        0,
                        80
                    )
                );

            }

        }

    );

}


// ==================================================
// TEXT
// ==================================================

function sendText(){

    const text =
        document
        .getElementById(
            "textInput"
        )
        .value
        .trim();


    if(text === ""){

        alert(
            "Please enter text."
        );

        return;

    }


    publishMessage(
        "TEXT:" + text
    );

}


// ==================================================
// HEART
// ==================================================

function sendHeart(){

    publishMessage(
        "HEART"
    );

}


// ==================================================
// WHO INVENTED
// ==================================================

function sendAbout(){

    publishMessage(
        "ABOUT"
    );

}


// ==================================================
// DRAWING CANVAS
// ==================================================

const canvas =
    document.getElementById(
        "drawCanvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


// ==================================================
// CANVAS INITIALIZATION
// ==================================================

function initializeCanvas(){

    ctx.fillStyle =
        "black";


    ctx.fillRect(
        0,
        0,
        128,
        64
    );


    ctx.strokeStyle =
        "white";


    ctx.lineWidth =
        1;


    ctx.lineCap =
        "round";


    ctx.lineJoin =
        "round";

}


initializeCanvas();


// ==================================================
// OPEN DRAWING
// ==================================================

function openDrawing(){

    document
        .getElementById(
            "drawArea"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "drawStatus"
        )
        .innerText =
        "Ready to draw";

}

// GET MOUSE / TOUCH POSITION
// ==================================================

function getPosition(event){

    const rect =
        canvas.getBoundingClientRect();


    let clientX;

    if(
