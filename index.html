<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OLED STUDIO</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at top left, #172331 0%, transparent 35%),
        radial-gradient(circle at bottom right, #111c29 0%, transparent 35%),
        #080d12;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {
    width: 94%;
    max-width: 1150px;

    margin: 28px auto;
}

/* =========================================================
   CARD
========================================================= */

.card {
    background: #151e29;

    border-radius: 26px;

    padding: 34px;

    margin-bottom: 24px;

    box-shadow:
        0 12px 35px rgba(0,0,0,0.30);

    border: 1px solid rgba(255,255,255,0.025);
}

/* =========================================================
   HEADER
========================================================= */

.header {
    text-align: center;

    padding:
        42px 25px;
}

.header h1 {
    margin: 0 0 10px;

    font-size: 46px;

    font-weight: 800;

    letter-spacing: 0.5px;
}

.subtitle {
    color: #9eb5d2;

    font-size: 21px;

    margin-top: 4px;
}

.status {
    margin-top: 24px;

    font-size: 20px;

    font-weight: 800;
}

.connected {
    color: #00e676;
}

.disconnected {
    color: #ff5252;
}

.connecting {
    color: #ffb300;
}

/* =========================================================
   HEADINGS
========================================================= */

h2 {
    margin: 0 0 16px;

    font-size: 31px;

    font-weight: 800;
}

.description {
    color: #9eb5d2;

    font-size: 19px;

    margin-bottom: 24px;
}

/* =========================================================
   INPUT
========================================================= */

input {
    width: 100%;

    padding: 19px 20px;

    border-radius: 14px;

    border: none;

    outline: none;

    background: #ffffff;

    color: #111111;

    font-size: 20px;

    margin-bottom: 18px;
}

input:focus {
    box-shadow:
        0 0 0 3px rgba(40,100,232,0.35);
}

/* =========================================================
   BUTTON CONTAINER
========================================================= */

.buttons {
    display: flex;

    flex-wrap: wrap;

    gap: 12px;
}

/* =========================================================
   BUTTON
========================================================= */

button {
    border: none;

    padding: 17px 27px;

    border-radius: 14px;

    color: white;

    font-size: 18px;

    font-weight: 800;

    cursor: pointer;

    transition:
        transform 0.18s ease,
        filter 0.18s ease,
        box-shadow 0.18s ease;
}

button:hover {
    transform: translateY(-2px);

    filter: brightness(1.10);
}

button:active {
    transform: translateY(0);
}

/* =========================================================
   BUTTON COLORS
========================================================= */

.blue {
    background: #2864e8;
}

.red {
    background: #ed174c;
}

.purple {
    background: #7738e8;
}

.orange {
    background: #ff9800;
}

.green {
    background: #08a879;
}

.gold {
    background: #d69b00;
}

.gray {
    background: #59616d;
}

/* =========================================================
   EFFECT BUTTON SIZES
========================================================= */

.effect-buttons button {
    min-width: 165px;
}

/* =========================================================
   DRAWING
========================================================= */

.canvas-container {
    display: none;

    margin-top: 25px;

    padding-top: 5px;
}

#drawCanvas {
    display: block;

    width: 100%;

    max-width: 768px;

    height: auto;

    background: #000000;

    border: 3px solid #ffffff;

    image-rendering: pixelated;

    cursor: crosshair;

    touch-action: none;

    border-radius: 4px;
}

/* =========================================================
   LOG
========================================================= */

.log {
    background: #05090d;

    border-radius: 16px;

    padding: 20px;

    height: 260px;

    overflow-y: auto;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    color: #00ff88;

    white-space: pre-wrap;

    font-size: 14px;

    line-height: 1.6;

    border: 1px solid rgba(255,255,255,0.03);
}

/* =========================================================
   SCROLLBAR
========================================================= */

.log::-webkit-scrollbar {
    width: 8px;
}

.log::-webkit-scrollbar-track {
    background: #080d12;
}

.log::-webkit-scrollbar-thumb {
    background: #343e4b;

    border-radius: 10px;
}

/* =========================================================
   SMALL TEXT
========================================================= */

.small {
    color: #8094ad;

    margin-top: 10px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .container {
        width: 95%;
        margin: 15px auto;
    }

    .card {
        padding: 23px;

        border-radius: 21px;

        margin-bottom: 18px;
    }

    .header {
        padding: 30px 15px;
    }

    .header h1 {
        font-size: 31px;
    }

    .subtitle {
        font-size: 17px;
    }

    .status {
        font-size: 17px;
    }

    h2 {
        font-size: 26px;
    }

    .description {
        font-size: 16px;
    }

    input {
        font-size: 17px;
    }

    button {
        width: 100%;

        font-size: 17px;
    }

    .effect-buttons button {
        min-width: 0;
    }

    .log {
        height: 220px;
    }
}

</style>
</head>

<body>

<div class="container">

<!-- =====================================================
     HEADER
===================================================== -->

<div class="card header">

    <h1>📺 OLED STUDIO</h1>

    <div class="subtitle">
        ESP8266 + MQTT OLED Controller
    </div>

    <div
        id="mqttStatus"
        class="status connecting"
    >
        MQTT STATUS: CONNECTING...
    </div>

</div>


<!-- =====================================================
     DISPLAY TEXT
===================================================== -->

<div class="card">

    <h2>📝 Display Text</h2>

    <div class="description">
        Enter text and send it to the OLED.
    </div>

    <input
        id="textInput"
        type="text"
        value="SANGEETH TECH"
        maxlength="80"
        placeholder="Enter text"
    >

    <div class="buttons">

        <button
            class="blue"
            onclick="sendText()"
        >
            📺 SHOW TEXT
        </button>

        <button
            class="purple"
            onclick="sendSlide()"
        >
            ➡️ SLIDE TEXT
        </button>

    </div>

</div>


<!-- =====================================================
     OLED EFFECTS
===================================================== -->

<div class="card">

    <h2>✨ OLED Effects</h2>

    <div class="description">
        Send special displays directly to the OLED.
    </div>

    <div class="buttons effect-buttons">

        <button
            class="red"
            onclick="sendCommand('HEART')"
        >
            ❤️ HEART
        </button>

        <button
            class="gold"
            onclick="sendCommand('STAR')"
        >
            ⭐ STAR
        </button>

        <button
            class="orange"
            onclick="sendCommand('TIME')"
        >
            🕐 TIME
        </button>

        <button
            class="purple"
            onclick="sendCommand('WHO')"
        >
            👤 WHO INVENTED?
        </button>

    </div>

</div>


<!-- =====================================================
     DRAWING
===================================================== -->

<div class="card">

    <h2>🎨 Drawing</h2>

    <div class="description">
        Draw anything and send it to the 128 × 64 OLED.
    </div>

    <div class="buttons">

        <button
            class="green"
            onclick="openDrawing()"
        >
            ✏️ OPEN DRAWING
        </button>

    </div>


    <div
        id="canvasContainer"
        class="canvas-container"
    >

        <canvas
            id="drawCanvas"
            width="128"
            height="64"
        ></canvas>

        <br>

        <div class="buttons">

            <button
                class="green"
                onclick="sendDrawing()"
            >
                📤 SEND DRAWING
            </button>

            <button
                class="gray"
                onclick="clearDrawing()"
            >
                🗑️ CLEAR
            </button>

            <button
                class="gray"
                onclick="closeDrawing()"
            >
                ❌ CLOSE
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     MQTT LOG
===================================================== -->

<div class="card">

    <h2>📡 MQTT LOG</h2>

    <div
        id="log"
        class="log"
    >Starting...</div>

</div>

</div>


<script>

/* =========================================================
   MQTT SETTINGS
========================================================= */

const MQTT_BROKER =
    "wss://broker.hivemq.com:8884/mqtt";

const MQTT_TOPIC =
    "sangeeth/oledstudio/2026/control";


/* =========================================================
   MQTT CLIENT
========================================================= */

let client = null;


/* =========================================================
   LOG
========================================================= */

function logMessage(message) {

    const log =
        document.getElementById("log");

    const now =
        new Date().toLocaleTimeString();

    log.textContent +=
        "\n[" +
        now +
        "] " +
        message;

    log.scrollTop =
        log.scrollHeight;
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text, className) {

    const status =
        document.getElementById("mqttStatus");

    status.textContent =
        "MQTT STATUS: " + text;

    status.className =
        "status " + className;
}


/* =========================================================
   CONNECT MQTT
========================================================= */

function connectMQTT() {

    setStatus(
        "CONNECTING...",
        "connecting"
    );

    logMessage(
        "Connecting to MQTT broker..."
    );

    const clientId =
        "OLEDStudioWeb-" +
        Math.random()
            .toString(16)
            .substring(2, 10);

    client =
        mqtt.connect(
            MQTT_BROKER,
            {
                clientId: clientId,

                clean: true,

                reconnectPeriod: 3000,

                connectTimeout: 10000
            }
        );


    /* =====================================================
       CONNECTED
    ===================================================== */

    client.on(
        "connect",
        function() {

            setStatus(
                "CONNECTED",
                "connected"
            );

            logMessage(
                "MQTT CONNECTED"
            );

            client.subscribe(
                MQTT_TOPIC,
                function(error) {

                    if (error) {

                        logMessage(
                            "Subscribe error: " +
                            error.message
                        );

                    } else {

                        logMessage(
                            "Subscribed to: " +
                            MQTT_TOPIC
                        );

                    }

                }
            );

        }
    );


    /* =====================================================
       ERROR
    ===================================================== */

    client.on(
        "error",
        function(error) {

            setStatus(
                "ERROR",
                "disconnected"
            );

            logMessage(
                "MQTT ERROR: " +
                error.message
            );

        }
    );


    /* =====================================================
       CLOSE
    ===================================================== */

    client.on(
        "close",
        function() {

            setStatus(
                "DISCONNECTED",
                "disconnected"
            );

            logMessage(
                "MQTT CONNECTION CLOSED"
            );

        }
    );


    /* =====================================================
       RECONNECT
    ===================================================== */

    client.on(
        "reconnect",
        function() {

            setStatus(
                "CONNECTING...",
                "connecting"
            );

            logMessage(
                "Trying to reconnect..."
            );

        }
    );


    /* =====================================================
       MESSAGE
    ===================================================== */

    client.on(
        "message",
        function(topic, message) {

            logMessage(
                "Received: " +
                message.toString()
            );

        }
    );

}


/* =========================================================
   PUBLISH
========================================================= */

function publishMessage(message) {

    if (
        !client ||
        !client.connected
    ) {

        logMessage(
            "MQTT NOT CONNECTED"
        );

        return;
    }

    client.publish(
        MQTT_TOPIC,
        message,
        {
            qos: 0,
            retain: false
        },
        function(error) {

            if (error) {

                logMessage(
                    "Publish error: " +
                    error.message
                );

            } else {

                logMessage(
                    "Sent: " +
                    message.substring(0, 100)
                );

            }

        }
    );

}


/* =========================================================
   SHOW TEXT
========================================================= */

function sendText() {

    const input =
        document.getElementById(
            "textInput"
        );

    const text =
        input.value.trim();

    if (!text) {

        alert(
            "Please enter some text."
        );

        return;
    }

    publishMessage(
        "TEXT:" + text
    );

}


/* =========================================================
   SLIDE TEXT
========================================================= */

function sendSlide() {

    const input =
        document.getElementById(
            "textInput"
        );

    const text =
        input.value.trim();

    if (!text) {

        alert(
            "Please enter some text."
        );

        return;
    }

    publishMessage(
        "SLIDE:" + text
    );

}


/* =========================================================
   SPECIAL COMMAND
========================================================= */

function sendCommand(command) {

    publishMessage(command);

}


/* =========================================================
   DRAWING VARIABLES
========================================================= */

const canvas =
    document.getElementById(
        "drawCanvas"
    );

const ctx =
    canvas.getContext("2d");

let drawing = false;


/* =========================================================
   CANVAS SETTINGS
========================================================= */

function setupCanvas() {

    ctx.fillStyle =
        "black";

    ctx.fillRect(
        0,
        0,
        128,
        64
    );

    ctx.strokeStyle =
        "white";

    ctx.lineWidth =
        1;

    ctx.lineCap =
        "round";

}


/* =========================================================
   OPEN DRAWING
========================================================= */

function openDrawing() {

    document.getElementById(
        "canvasContainer"
    ).style.display =
        "block";

    setupCanvas();

}


/* =========================================================
   CLOSE DRAWING
========================================================= */

function closeDrawing() {

    document.getElementById(
        "canvasContainer"
    ).style.display =
        "none";

}


/* =========================================================
   CLEAR DRAWING
========================================================= */

function clearDrawing() {

    setupCanvas();

}


/* =========================================================
   CANVAS POSITION
========================================================= */

function getCanvasPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    let clientX;
    let clientY;

    if (
        event.touches &&
        event.touches.length > 0
    ) {

        clientX =
            event.touches[0].clientX;

        clientY =
            event.touches[0].clientY;

    } else {

        clientX =
            event.clientX;

        clientY =
            event.clientY;

    }

    const x =
        Math.floor(
            (clientX - rect.left) *
            128 /
            rect.width
        );

    const y =
        Math.floor(
            (clientY - rect.top) *
            64 /
            rect.height
        );

    return {

        x: Math.max(
            0,
            Math.min(127, x)
        ),

        y: Math.max(
            0,
            Math.min(63, y)
        )

    };

}


/* =========================================================
   START DRAW
========================================================= */

function startDrawing(event) {

    event.preventDefault();

    drawing = true;

    const pos =
        getCanvasPosition(event);

    ctx.beginPath();

    ctx.moveTo(
        pos.x,
        pos.y
    );

}


/* =========================================================
   DRAW
========================================================= */

function draw(event) {

    if (!drawing) {
        return;
    }

    event.preventDefault();

    const pos =
        getCanvasPosition(event);

    ctx.lineTo(
        pos.x,
        pos.y
    );

    ctx.stroke();

}


/* =========================================================
   STOP DRAW
========================================================= */

function stopDrawing(event) {

    if (event) {
        event.preventDefault();
    }

    drawing = false;

    ctx.closePath();

}


/* =========================================================
   MOUSE EVENTS
========================================================= */

canvas.addEventListener(
    "mousedown",
    startDrawing
);

canvas.addEventListener(
    "mousemove",
    draw
);

canvas.addEventListener(
    "mouseup",
    stopDrawing
);

canvas.addEventListener(
    "mouseleave",
    stopDrawing
);


/* =========================================================
   TOUCH EVENTS
========================================================= */

canvas.addEventListener(
    "touchstart",
    startDrawing,
    {
        passive: false
    }
);

canvas.addEventListener(
    "touchmove",
    draw,
    {
        passive: false
    }
);

canvas.addEventListener(
    "touchend",
    stopDrawing,
    {
        passive: false
    }
);


/* =========================================================
   CANVAS → OLED BITMAP
========================================================= */

function canvasToBitmap() {

    const image =
        ctx.getImageData(
            0,
            0,
            128,
            64
        );

    const bitmap =
        new Uint8Array(1024);


    for (
        let y = 0;
        y < 64;
        y++
    ) {

        for (
            let x = 0;
            x < 128;
            x++
        ) {

            const pixelIndex =
                (y * 128 + x) * 4;

            const r =
                image.data[pixelIndex];

            const g =
                image.data[pixelIndex + 1];

            const b =
                image.data[pixelIndex + 2];


            const isWhite =
                (
                    r > 100 ||
                    g > 100 ||
                    b > 100
                );


            if (isWhite) {

                const page =
                    Math.floor(y / 8);

                const bit =
                    y % 8;

                const index =
                    page * 128 + x;

                bitmap[index] |=
                    (1 << bit);

            }

        }

    }

    return bitmap;

}


/* =========================================================
   UINT8ARRAY → BASE64
========================================================= */

function uint8ToBase64(bytes) {

    let binary = "";

    const chunkSize = 0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );

        binary += String.fromCharCode(
            ...chunk
        );

    }

    return btoa(binary);

}


/* =========================================================
   SEND DRAWING
========================================================= */

function sendDrawing() {

    const bitmap =
        canvasToBitmap();

    const base64 =
        uint8ToBase64(bitmap);

    logMessage(
        "Drawing size: " +
        bitmap.length +
        " bytes"
    );

    logMessage(
        "Base64 size: " +
        base64.length
    );

    publishMessage(
        "DRAW:" + base64
    );

}


/* =========================================================
   ENTER KEY → SHOW TEXT
========================================================= */

document.getElementById(
    "textInput"
).addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendText();

        }

    }
);


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    function() {

        setupCanvas();

        connectMQTT();

    }
);

</script>

</body>
</html>
