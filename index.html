<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OLED STUDIO</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #080d12;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1125px;
    margin: auto;
}

.card {
    background: #151c25;
    border-radius: 28px;
    padding: 28px;
    margin-bottom: 22px;
}

.header {
    text-align: center;
}

.header h1 {
    font-size: 38px;
    margin: 5px 0;
}

.header p {
    color: #9fb4ce;
    font-size: 21px;
}

.status {
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
}

#statusText {
    color: orange;
}

h2 {
    font-size: 30px;
    margin-top: 0;
}

.description {
    color: #a9bdd5;
    font-size: 19px;
}

input {
    width: 100%;
    padding: 17px;
    border-radius: 13px;
    border: 1px solid #c5d2e5;
    font-size: 20px;
    margin: 10px 0 15px;
}

button {
    border: none;
    border-radius: 13px;
    padding: 16px 25px;
    margin: 5px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.textBtn {
    background: #2864e8;
}

.heartBtn {
    background: #e7194f;
}

.whoBtn {
    background: #7a35e8;
}

.drawBtn {
    background: #08a36f;
}

.clearBtn {
    background: #555;
}

.sendDrawBtn {
    background: #2864e8;
}

.log {
    background: #05090d;
    height: 180px;
    overflow-y: auto;
    border-radius: 14px;
    padding: 15px;
    color: #62ffae;
    font-family: monospace;
    white-space: pre-wrap;
}

/* Drawing popup */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.modalBox {
    background: #151c25;
    padding: 25px;
    border-radius: 25px;
    width: 100%;
    max-width: 750px;
}

.modalBox h2 {
    text-align: center;
}

.canvasContainer {
    width: 100%;
    overflow: auto;
    background: black;
    padding: 15px;
    border-radius: 15px;
    text-align: center;
}

/*
   Actual OLED resolution:
   128 x 64
*/
#drawCanvas {
    width: 640px;
    height: 320px;
    max-width: 100%;
    image-rendering: pixelated;
    background: black;
    border: 3px solid white;
    touch-action: none;
}

.controls {
    text-align: center;
    margin-top: 15px;
}

.closeBtn {
    background: #d93434;
}

.info {
    text-align: center;
    color: #9fb4ce;
    margin-top: 10px;
}

@media(max-width:600px) {

    body {
        padding: 10px;
    }

    .card {
        padding: 20px;
        border-radius: 20px;
    }

    .header h1 {
        font-size: 30px;
    }

    h2 {
        font-size: 25px;
    }

    button {
        width: 100%;
        margin: 5px 0;
    }

    #drawCanvas {
        width: 100%;
        height: auto;
        aspect-ratio: 2 / 1;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="card header">

        <h1>📺 OLED STUDIO</h1>

        <p>
            ESP8266 + MQTT OLED Controller
        </p>

        <div class="status">
            MQTT STATUS:
            <span id="statusText">CONNECTING...</span>
        </div>

    </div>


    <!-- TEXT -->

    <div class="card">

        <h2>📝 Display Text</h2>

        <p class="description">
            Enter text and send it to the OLED.
        </p>

        <input
            id="textInput"
            type="text"
            value="SANGEETH TECH"
            maxlength="100"
            placeholder="Enter text"
        >

        <button
            class="textBtn"
            onclick="sendText()">
            📺 SHOW TEXT
        </button>

        <button
            class="heartBtn"
            onclick="sendHeart()">
            ❤️ HEART
        </button>

        <button
            class="whoBtn"
            onclick="sendWho()">
            👤 WHO INVENTED?
        </button>

    </div>


    <!-- DRAWING -->

    <div class="card">

        <h2>🎨 Drawing</h2>

        <p class="description">
            Draw anything and send it to the 128 × 64 OLED.
        </p>

        <button
            class="drawBtn"
            onclick="openDrawing()">
            ✏️ OPEN DRAWING
        </button>

    </div>


    <!-- MQTT LOG -->

    <div class="card">

        <h2>📡 MQTT LOG</h2>

        <div id="log" class="log">
Starting...
        </div>

    </div>

</div>


<!-- DRAWING WINDOW -->

<div id="drawingModal" class="modal">

    <div class="modalBox">

        <h2>🎨 OLED Drawing</h2>

        <div class="canvasContainer">

            <canvas
                id="drawCanvas"
                width="128"
                height="64">
            </canvas>

        </div>

        <div class="info">
            OLED resolution: 128 × 64
        </div>

        <div class="controls">

            <button
                class="clearBtn"
                onclick="clearCanvas()">
                🗑️ CLEAR
            </button>

            <button
                class="sendDrawBtn"
                onclick="sendDrawing()">
                📺 SEND TO OLED
            </button>

            <button
                class="closeBtn"
                onclick="closeDrawing()">
                ✖ CLOSE
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   MQTT SETTINGS
   ===================================================== */

const MQTT_BROKER = "broker.emqx.io";

const MQTT_PORT = 8084;

const MQTT_PATH = "/mqtt";

const MQTT_TOPIC = "sangeeth/oled-studio/test";


/* =====================================================
   VARIABLES
   ===================================================== */

let mqttClient = null;

const statusText =
    document.getElementById("statusText");

const logBox =
    document.getElementById("log");


/* =====================================================
   LOG FUNCTION
   ===================================================== */

function log(message) {

    const time =
        new Date().toLocaleTimeString();

    logBox.innerHTML +=
        "[" + time + "] " + message + "\n";

    logBox.scrollTop =
        logBox.scrollHeight;
}


/* =====================================================
   MQTT CONNECT
   ===================================================== */

function connectMQTT() {

    log("Connecting to MQTT...");

    statusText.innerText =
        "CONNECTING...";

    statusText.style.color =
        "orange";


    mqttClient = mqtt.connect(
        `wss://${MQTT_BROKER}:${MQTT_PORT}${MQTT_PATH}`,
        {
            clean: true,

            connectTimeout: 10000,

            reconnectPeriod: 3000,

            clientId:
                "OLED_WEB_" +
                Math.random()
                    .toString(16)
                    .substring(2, 10)
        }
    );


    /* CONNECTED */

    mqttClient.on("connect", function() {

        statusText.innerText =
            "CONNECTED";

        statusText.style.color =
            "#00ff88";

        log("MQTT CONNECTED");

        mqttClient.subscribe(
            MQTT_TOPIC,
            function(error) {

                if (error) {

                    log(
                        "Subscribe error: " +
                        error.message
                    );

                } else {

                    log(
                        "Subscribed to: " +
                        MQTT_TOPIC
                    );

                }

            }
        );

    });


    /* MESSAGE */

    mqttClient.on("message",
        function(topic, message) {

            log(
                "Received: " +
                message.toString()
            );

        }
    );


    /* ERROR */

    mqttClient.on("error",
        function(error) {

            statusText.innerText =
                "ERROR";

            statusText.style.color =
                "#ff4444";

            log(
                "MQTT ERROR: " +
                error.message
            );

        }
    );


    /* DISCONNECT */

    mqttClient.on("close",
        function() {

            statusText.innerText =
                "CONNECTING...";

            statusText.style.color =
                "orange";

            log("MQTT disconnected");

        }
    );

}


/* =====================================================
   PUBLISH FUNCTION
   ===================================================== */

function publishCommand(command) {

    if (
        !mqttClient ||
        !mqttClient.connected
    ) {

        alert(
            "MQTT is not connected yet."
        );

        log(
            "Cannot send - MQTT offline"
        );

        return false;
    }


    mqttClient.publish(
        MQTT_TOPIC,
        command,
        {
            qos: 0,
            retain: false
        }
    );


    log(
        "Sent: " + command
    );

    return true;
}


/* =====================================================
   SHOW TEXT
   ===================================================== */

function sendText() {

    const text =
        document
        .getElementById("textInput")
        .value
        .trim();


    if (!text) {

        alert(
            "Please enter some text."
        );

        return;
    }


    /*
       Command format:
       TEXT:your message
    */

    publishCommand(
        "TEXT:" + text
    );
}


/* =====================================================
   HEART
   ===================================================== */

function sendHeart() {

    publishCommand(
        "HEART"
    );
}


/* =====================================================
   WHO INVENTED
   ===================================================== */

function sendWho() {

    publishCommand(
        "WHO"
    );
}


/* =====================================================
   DRAWING
   ===================================================== */

const canvas =
    document.getElementById("drawCanvas");

const ctx =
    canvas.getContext("2d");


ctx.fillStyle = "black";

ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
);

ctx.strokeStyle = "white";

ctx.lineWidth = 1;

ctx.lineCap = "round";


let drawing = false;


/* =====================================================
   MOUSE DRAWING
   ===================================================== */

function getPosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    const scaleX =
        canvas.width /
        rect.width;

    const scaleY =
        canvas.height /
        rect.height;


    return {

        x:
            (event.clientX -
             rect.left) * scaleX,

        y:
            (event.clientY -
             rect.top) * scaleY

    };

}


canvas.addEventListener(
    "pointerdown",
    function(event) {

        drawing = true;

        canvas.setPointerCapture(
            event.pointerId
        );

        const pos =
            getPosition(event);

        ctx.beginPath();

        ctx.moveTo(
            Math.floor(pos.x),
            Math.floor(pos.y)
        );

    }
);


canvas.addEventListener(
    "pointermove",
    function(event) {

        if (!drawing)
            return;


        const pos =
            getPosition(event);


        ctx.lineTo(
            Math.floor(pos.x),
            Math.floor(pos.y)
        );

        ctx.stroke();

    }
);


canvas.addEventListener(
    "pointerup",
    function() {

        drawing = false;

    }
);


canvas.addEventListener(
    "pointercancel",
    function() {

        drawing = false;

    }
);


/* =====================================================
   OPEN DRAWING
   ===================================================== */

function openDrawing() {

    document
        .getElementById("drawingModal")
        .style.display = "flex";

}


/* =====================================================
   CLOSE DRAWING
   ===================================================== */

function closeDrawing() {

    document
        .getElementById("drawingModal")
        .style.display = "none";

}


/* =====================================================
   CLEAR CANVAS
   ===================================================== */

function clearCanvas() {

    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =====================================================
   CONVERT CANVAS TO OLED BITMAP
   ===================================================== */

function canvasToOLEDHex() {

    let hex = "";


    /*
       SSD1306 uses 8 vertical pixels
       per byte.
    */

    for (
        let page = 0;
        page < 8;
        page++
    ) {

        for (
            let x = 0;
            x < 128;
            x++
        ) {

            let value = 0;


            for (
                let bit = 0;
                bit < 8;
                bit++
            ) {

                const y =
                    page * 8 + bit;


                const pixel =
                    ctx.getImageData(
                        x,
                        y,
                        1,
                        1
                    ).data;


                const brightness =
                    pixel[0] +
                    pixel[1] +
                    pixel[2];


                if (
                    brightness > 100
                ) {

                    value |=
                        (1 << bit);

                }

            }


            hex +=
                value
                .toString(16)
                .padStart(2, "0");

        }

    }


    return hex;
}


/* =====================================================
   SEND DRAWING
   ===================================================== */

function sendDrawing() {

    if (
        !mqttClient ||
        !mqttClient.connected
    ) {

        alert(
            "MQTT is not connected."
        );

        return;
    }


    const bitmap =
        canvasToOLEDHex();


    /*
       Drawing command:
       DRAW:<2048 HEX CHARACTERS>
    */

    const command =
        "DRAW:" + bitmap;


    mqttClient.publish(
        MQTT_TOPIC,
        command,
        {
            qos: 0,
            retain: false
        }
    );


    log(
        "Drawing sent to OLED"
    );

    closeDrawing();

}


/* =====================================================
   START MQTT
   ===================================================== */

connectMQTT();

</script>

</body>
</html>
