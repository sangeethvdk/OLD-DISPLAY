<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>OLED STUDIO</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #080d12;

    color: white;

}

.container {

    width: 90%;

    max-width: 1120px;

    margin: auto;

}

.card {

    background: #151d27;

    border-radius: 28px;

    padding: 28px;

    margin: 25px 0;

}

.header {

    text-align: center;

}

.header h1 {

    font-size: 38px;

    margin: 0 0 10px;

}

.subtitle {

    color: #9db4d0;

    font-size: 20px;

}

.status {

    margin-top: 18px;

    font-size: 20px;

    font-weight: bold;

}

#statusText {

    color: orange;

}

input {

    width: 100%;

    padding: 17px;

    border-radius: 12px;

    border: none;

    font-size: 20px;

    margin: 15px 0;

}

button {

    border: none;

    border-radius: 14px;

    padding: 17px 25px;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    margin: 5px;

}

.textBtn {

    background: #2864e6;
}

.heartBtn {

    background: #ed174b;
}

.whoBtn {

    background: #7b35e8;
}

.drawBtn {

    background: #05a875;
}

.clearBtn {

    background: #555;
}

button:hover {

    opacity: 0.85;

}

#log {

    height: 220px;

    overflow-y: auto;

    background: #05080c;

    border-radius: 12px;

    padding: 15px;

    color: #00ff91;

    font-family: monospace;

    white-space: pre-wrap;

}

/* DRAWING */

#drawingArea {

    display: none;

}

.canvasContainer {

    background: black;

    padding: 15px;

    border-radius: 15px;

    display: inline-block;

}

#drawCanvas {

    width: 640px;

    height: 320px;

    background: black;

    border: 3px solid white;

    image-rendering: pixelated;

    touch-action: none;

    cursor: crosshair;

}

.drawControls {

    margin-top: 15px;

}

@media(max-width: 700px) {

    #drawCanvas {

        width: 100%;

        height: auto;

        aspect-ratio: 2 / 1;

    }

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="card header">

<h1>📺 OLED STUDIO</h1>

<div class="subtitle">

ESP8266 + MQTT OLED Controller

</div>

<div class="status">

MQTT STATUS:

<span id="statusText">CONNECTING...</span>

</div>

</div>


<!-- TEXT -->

<div class="card">

<h2>📝 Display Text</h2>

<div class="subtitle">

Enter text and send it to the OLED.

</div>

<input

id="textInput"

type="text"

value="SANGEETH TECH"

placeholder="Enter text">

<br>

<button

class="textBtn"

onclick="sendText()">

📺 SHOW TEXT

</button>

<button

class="heartBtn"

onclick="sendCommand('HEART')">

❤️ HEART

</button>

<button

class="whoBtn"

onclick="sendCommand('WHO')">

👤 WHO INVENTED?

</button>

</div>


<!-- DRAW -->

<div class="card">

<h2>🎨 Drawing</h2>

<div class="subtitle">

Draw anything and send it to the 128 × 64 OLED.

</div>

<br>

<button

class="drawBtn"

onclick="openDrawing()">

✏️ OPEN DRAWING

</button>

<div id="drawingArea">

<br>

<div class="canvasContainer">

<canvas

id="drawCanvas"

width="128"

height="64">

</canvas>

</div>

<div class="drawControls">

<button

class="drawBtn"

onclick="sendDrawing()">

📤 SEND DRAWING

</button>

<button

class="clearBtn"

onclick="clearCanvas()">

🗑 CLEAR

</button>

<button

class="clearBtn"

onclick="closeDrawing()">

❌ CLOSE

</button>

</div>

</div>

</div>


<!-- MQTT LOG -->

<div class="card">

<h2>📡 MQTT LOG</h2>

<div id="log">

Starting...

</div>

</div>

</div>


<script>

// =====================================================
// MQTT
// =====================================================

const broker = "wss://broker.emqx.io:8084/mqtt";

const topic = "sangeeth/oled-studio/test";

let client;

const statusText =
document.getElementById("statusText");

const log =
document.getElementById("log");


// =====================================================
// LOG
// =====================================================

function addLog(message) {

    const now = new Date();

    const time =
        now.toLocaleTimeString();

    log.innerHTML +=
        "\n[" + time + "] " + message;

    log.scrollTop = log.scrollHeight;
}


// =====================================================
// MQTT CONNECT
// =====================================================

function connectMQTT() {

    addLog("Connecting to MQTT...");

    client = mqtt.connect(broker, {

        clientId:
            "OLEDStudioWeb-" +
            Math.random()
                .toString(16)
                .substring(2),

        clean: true,

        connectTimeout: 10000,

        reconnectPeriod: 3000

    });


    client.on("connect", function() {

        statusText.innerText =
            "CONNECTED";

        statusText.style.color =
            "#00ff91";

        addLog("MQTT CONNECTED");

        client.subscribe(topic, function(error) {

            if (!error) {

                addLog(
                    "Subscribed: " + topic
                );

            }

        });

    });


    client.on("reconnect", function() {

        statusText.innerText =
            "RECONNECTING...";

        statusText.style.color =
            "orange";

        addLog("MQTT reconnecting...");

    });


    client.on("offline", function() {

        statusText.innerText =
            "OFFLINE";

        statusText.style.color =
            "red";

        addLog("MQTT offline");

    });


    client.on("error", function(error) {

        statusText.innerText =
            "ERROR";

        statusText.style.color =
            "red";

        addLog(
            "MQTT ERROR: " +
            error.message
        );

    });


    client.on("message", function(topic, message) {

        addLog(
            "Received: " +
            message.toString()
        );

    });

}


// =====================================================
// SEND MQTT
// =====================================================

function publish(message) {

    if (!client || !client.connected) {

        alert("MQTT is not connected!");

        return;

    }

    client.publish(
        topic,
        message,
        {
            qos: 0,
            retain: false
        }
    );

    addLog(
        "Sent: " + message.substring(0, 100)
    );

}


// =====================================================
// TEXT
// =====================================================

function sendText() {

    const text =
        document.getElementById(
            "textInput"
        ).value;

    if (!text) {

        alert("Enter some text!");

        return;
    }

    publish(
        "TEXT:" + text
    );

}


// =====================================================
// COMMAND
// =====================================================

function sendCommand(command) {

    publish(command);

}


// =====================================================
// CANVAS
// =====================================================

const canvas =
    document.getElementById(
        "drawCanvas"
    );

const ctx =
    canvas.getContext("2d");

ctx.fillStyle = "black";

ctx.fillRect(
    0,
    0,
    128,
    64
);

ctx.fillStyle = "white";


// =====================================================
// DRAWING VARIABLES
// =====================================================

let drawing = false;


// =====================================================
// GET CANVAS POSITION
// =====================================================

function getPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    let x =
        (event.clientX - rect.left)
        * (128 / rect.width);

    let y =
        (event.clientY - rect.top)
        * (64 / rect.height);

    x = Math.floor(x);

    y = Math.floor(y);

    return {
        x: x,
        y: y
    };

}


// =====================================================
// START DRAW
// =====================================================

canvas.addEventListener(
    "pointerdown",
    function(event) {

        drawing = true;

        canvas.setPointerCapture(
            event.pointerId
        );

        const p =
            getPosition(event);

        ctx.fillRect(
            p.x,
            p.y,
            2,
            2
        );

    }
);


// =====================================================
// DRAW
// =====================================================

canvas.addEventListener(
    "pointermove",
    function(event) {

        if (!drawing) return;

        const p =
            getPosition(event);

        ctx.fillRect(
            p.x,
            p.y,
            2,
            2
        );

    }
);


// =====================================================
// STOP DRAW
// =====================================================

canvas.addEventListener(
    "pointerup",
    function() {

        drawing = false;

    }
);

canvas.addEventListener(
    "pointercancel",
    function() {

        drawing = false;

    }
);


// =====================================================
// OPEN DRAWING
// =====================================================

function openDrawing() {

    document.getElementById(
        "drawingArea"
    ).style.display = "block";

    addLog(
        "Drawing canvas opened"
    );

}


// =====================================================
// CLOSE DRAWING
// =====================================================

function closeDrawing() {

    document.getElementById(
        "drawingArea"
    ).style.display = "none";

}


// =====================================================
// CLEAR CANVAS
// =====================================================

function clearCanvas() {

    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        128,
        64
    );

    ctx.fillStyle = "white";

}


// =====================================================
// CANVAS → HEX
// =====================================================

function canvasToHex() {

    const imageData =
        ctx.getImageData(
            0,
            0,
            128,
            64
        );

    const pixels =
        imageData.data;

    let hex = "";


    // 8192 pixels / 8 = 1024 bytes

    for (
        let byteIndex = 0;
        byteIndex < 1024;
        byteIndex++
    ) {

        let value = 0;


        for (
            let bit = 0;
            bit < 8;
            bit++
        ) {

            const pixelIndex =
                byteIndex * 8 + bit;

            const r =
                pixels[pixelIndex * 4];

            const g =
                pixels[pixelIndex * 4 + 1];

            const b =
                pixels[pixelIndex * 4 + 2];


            // White pixel = 1

            const brightness =
                (r + g + b) / 3;


            if (brightness > 100) {

                value |=
                    (1 << (7 - bit));

            }

        }


        hex +=
            value
                .toString(16)
                .padStart(2, "0");

    }

    return hex;

}


// =====================================================
// SEND DRAWING
// =====================================================

function sendDrawing() {

    const hex =
        canvasToHex();

    const message =
        "DRAW:" + hex;


    console.log(
        "Drawing data length:",
        message.length
    );


    publish(message);

    addLog(
        "Drawing sent: " +
        message.length +
        " characters"
    );

}


// =====================================================
// START
// =====================================================

connectMQTT();

</script>

</body>

</html>
