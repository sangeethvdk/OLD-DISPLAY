<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>OLED Studio</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#101010;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
}

h1{
    text-align:center;
    margin-bottom:5px;
    font-size:30px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:20px;
}

.statusBox{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
    font-weight:bold;
}

.statusDot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#777;
}

.statusText{
    color:#aaa;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

button{
    border:none;
    border-radius:12px;
    padding:17px 10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:#242424;
    color:white;
    transition:0.2s;
}

button:hover{
    background:#333;
    transform:translateY(-1px);
}

button:active{
    transform:scale(0.98);
}

.drawingSection{
    margin-top:25px;
    background:#181818;
    padding:18px;
    border-radius:15px;
}

.drawingTitle{
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
}

canvas{
    display:block;
    width:100%;
    max-width:512px;
    height:auto;
    aspect-ratio:2/1;
    margin:0 auto;
    background:black;
    border:2px solid #444;
    image-rendering:pixelated;
    touch-action:none;
}

.drawingButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

.logBox{
    margin-top:20px;
    background:#080808;
    border:1px solid #292929;
    border-radius:12px;
    padding:12px;
    height:180px;
    overflow-y:auto;
    font-family:monospace;
    font-size:13px;
}

.logLine{
    margin-bottom:6px;
    color:#aaa;
    word-break:break-word;
}

.inputArea{
    display:flex;
    gap:10px;
    margin-top:15px;
}

input{
    flex:1;
    padding:14px;
    border-radius:10px;
    border:1px solid #444;
    background:#202020;
    color:white;
    outline:none;
}

.sendInput{
    padding:14px 18px;
}

@media(max-width:500px){

    .buttons{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="container">

    <h1>OLED STUDIO</h1>

    <div class="subtitle">
        ESP8266 • MQTT • OLED Dashboard
    </div>

    <!-- MQTT STATUS -->

    <div class="statusBox">

        <div id="statusDot"
             class="statusDot">
        </div>

        <div id="statusText"
             class="statusText">
            OFFLINE
        </div>

    </div>


    <!-- TEXT INPUT -->

    <div class="inputArea">

        <input
            id="textInput"
            type="text"
            placeholder="Enter text for OLED"
            maxlength="80"
        >

        <button
            class="sendInput"
            onclick="sendText()">
            SEND
        </button>

    </div>


    <!-- MAIN BUTTONS -->

    <div class="buttons">

        <button onclick="sendText()">
            SHOW TEXT
        </button>

        <button onclick="sendSlide()">
            SLIDE TEXT
        </button>

        <button onclick="sendCommand('HEART')">
            ❤️ HEART
        </button>

        <button onclick="sendCommand('STAR')">
            ⭐ STAR
        </button>

        <button onclick="sendCommand('TIME')">
            🕒 TIME
        </button>

        <button onclick="sendCommand('WHO')">
            WHO INVENTED?
        </button>

    </div>


    <!-- DRAWING -->

    <div class="drawingSection">

        <div class="drawingTitle">
            DRAWING
        </div>

        <canvas
            id="drawCanvas"
            width="128"
            height="64">
        </canvas>

        <div class="drawingButtons">

            <button onclick="clearCanvas()">
                CLEAR
            </button>

            <button onclick="sendDrawing()">
                SEND DRAWING
            </button>

        </div>

    </div>


    <!-- LOG -->

    <div id="logBox"
         class="logBox">
    </div>

</div>


<script>

// =====================================================
// MQTT SETTINGS
// =====================================================

const MQTT_URL =
    "wss://broker.emqx.io:8084/mqtt";

const MQTT_TOPIC =
    "sangeeth/oled-studio/test";


// =====================================================
// MQTT CLIENT
// =====================================================

let mqttClient = null;


// =====================================================
// HTML ELEMENTS
// =====================================================

const statusDot =
    document.getElementById("statusDot");

const statusText =
    document.getElementById("statusText");

const logBox =
    document.getElementById("logBox");

const textInput =
    document.getElementById("textInput");


// =====================================================
// LOG
// =====================================================

function addLog(message){

    const line =
        document.createElement("div");

    line.className = "logLine";

    const time =
        new Date().toLocaleTimeString();

    line.textContent =
        "[" + time + "] " + message;

    logBox.prepend(line);

}


// =====================================================
// MQTT STATUS
// =====================================================

function setStatus(online){

    if(online){

        statusDot.style.background =
            "#00ff66";

        statusText.textContent =
            "ONLINE";

        statusText.style.color =
            "#00ff66";

    }
    else{

        statusDot.style.background =
            "#777";

        statusText.textContent =
            "OFFLINE";

        statusText.style.color =
            "#aaa";

    }

}


// =====================================================
// CONNECT MQTT
// =====================================================

function connectMQTT(){

    addLog("Connecting to MQTT...");

    mqttClient = mqtt.connect(
        MQTT_URL,
        {
            clientId:
                "OLED_WEB_" +
                Math.random()
                    .toString(16)
                    .substring(2),

            clean:true,

            connectTimeout:5000,

            reconnectPeriod:3000
        }
    );


    mqttClient.on("connect",function(){

        setStatus(true);

        addLog("MQTT connected.");

        mqttClient.subscribe(
            MQTT_TOPIC,
            function(error){

                if(error){

                    addLog(
                        "Subscribe error: " +
                        error.message
                    );

                }
                else{

                    addLog(
                        "Subscribed to topic."
                    );

                }

            }
        );

    });


    mqttClient.on("reconnect",function(){

        setStatus(false);

        addLog("MQTT reconnecting...");

    });


    mqttClient.on("offline",function(){

        setStatus(false);

        addLog("MQTT offline.");

    });


    mqttClient.on("error",function(error){

        setStatus(false);

        addLog(
            "MQTT error: " +
            error.message
        );

    });


    mqttClient.on("message",
        function(topic,message){

            addLog(
                "Received: " +
                message.toString()
            );

        }
    );

}


// =====================================================
// PUBLISH MESSAGE
// =====================================================

function publishMessage(message){

    if(!mqttClient){

        addLog("MQTT client not ready.");

        return;
    }


    if(!mqttClient.connected){

        addLog("MQTT is offline.");

        return;
    }


    mqttClient.publish(
        MQTT_TOPIC,
        message,
        {
            qos:0,
            retain:false
        },
        function(error){

            if(error){

                addLog(
                    "Publish error: " +
                    error.message
                );

            }
            else{

                addLog(
                    "Sent: " +
                    (
                        message.length > 100
                        ? "[DRAWING]"
                        : message
                    )
                );

            }

        }
    );

}


// =====================================================
// SHOW TEXT
// =====================================================

function sendText(){

    let text =
        textInput.value.trim();


    if(text === ""){

        text =
            prompt("Enter text:");

    }


    if(!text){

        return;
    }


    publishMessage(
        "TEXT:" + text
    );

}


// =====================================================
// SLIDE TEXT
// =====================================================

function sendSlide(){

    let text =
        prompt("Enter sliding text:");

    if(!text){

        return;
    }

    publishMessage(
        "SLIDE:" + text
    );

}


// =====================================================
// SIMPLE COMMAND
// =====================================================

function sendCommand(command){

    publishMessage(command);

}


// =====================================================
// CANVAS
// =====================================================

const canvas =
    document.getElementById("drawCanvas");

const ctx =
    canvas.getContext("2d");


// Black background

ctx.fillStyle = "black";

ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
);


// White drawing

ctx.strokeStyle = "white";

ctx.fillStyle = "white";

ctx.lineWidth = 2;

ctx.lineCap = "round";

ctx.lineJoin = "round";


let drawing = false;


// =====================================================
// MOUSE / TOUCH POSITION
// =====================================================

function getCanvasPosition(event){

    const rect =
        canvas.getBoundingClientRect();

    let clientX;
    let clientY;


    if(event.touches &&
       event.touches.length > 0){

        clientX =
            event.touches[0].clientX;

        clientY =
            event.touches[0].clientY;

    }
    else{

        clientX =
            event.clientX;

        clientY =
            event.clientY;

    }


    const x =
        (clientX - rect.left)
        * canvas.width
        / rect.width;


    const y =
        (clientY - rect.top)
        * canvas.height
        / rect.height;


    return {
        x:Math.floor(x),
        y:Math.floor(y)
    };

}


// =====================================================
// START DRAW
// =====================================================

function startDrawing(event){

    event.preventDefault();

    drawing = true;

    const pos =
        getCanvasPosition(event);

    ctx.beginPath();

    ctx.moveTo(
        pos.x,
        pos.y
    );

}


// =====================================================
// DRAW
// =====================================================

function draw(event){

    if(!drawing){

        return;
    }

    event.preventDefault();

    const pos =
        getCanvasPosition(event);

    ctx.lineTo(
        pos.x,
        pos.y
    );

    ctx.stroke();

}


// =====================================================
// STOP
// =====================================================

function stopDrawing(event){

    if(event){

        event.preventDefault();

    }

    drawing = false;

    ctx.beginPath();

}


// =====================================================
// MOUSE EVENTS
// =====================================================

canvas.addEventListener(
    "mousedown",
    startDrawing
);

canvas.addEventListener(
    "mousemove",
    draw
);

canvas.addEventListener(
    "mouseup",
    stopDrawing
);

canvas.addEventListener(
    "mouseleave",
    stopDrawing
);


// =====================================================
// TOUCH EVENTS
// =====================================================

canvas.addEventListener(
    "touchstart",
    startDrawing,
    {passive:false}
);

canvas.addEventListener(
    "touchmove",
    draw,
    {passive:false}
);

canvas.addEventListener(
    "touchend",
    stopDrawing,
    {passive:false}
);


// =====================================================
// CLEAR CANVAS
// =====================================================

function clearCanvas(){

    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "white";

    addLog("Canvas cleared.");

}


// =====================================================
// DRAWING -> HEX
//
// 128 x 64 = 8192 pixels
//
// 8 pixels per byte
//
// 8192 / 8 = 1024 bytes
//
// 1024 bytes x 2 = 2048 HEX characters
// =====================================================

function getHexData(){

    const imageData =
        ctx.getImageData(
            0,
            0,
            128,
            64
        );

    let hex = "";


    for(let y = 0; y < 64; y++){

        for(let byteX = 0;
            byteX < 16;
            byteX++){

            let value = 0;


            for(let bit = 0;
                bit < 8;
                bit++){

                const x =
                    byteX * 8 + bit;


                const index =
                    (y * 128 + x) * 4;


                const red =
                    imageData.data[index];


                const green =
                    imageData.data[index + 1];


                const blue =
                    imageData.data[index + 2];


                const brightness =
                    (red + green + blue) / 3;


                if(brightness > 127){

                    value |=
                        (1 << bit);

                }

            }


            hex +=
                value
                    .toString(16)
                    .padStart(2,"0");

        }

    }


    return hex;

}


// =====================================================
// SEND DRAWING
// =====================================================

function sendDrawing(){

    const hexData =
        getHexData();


    if(hexData.length !== 2048){

        addLog(
            "Drawing conversion error."
        );

        return;
    }


    addLog(
        "Preparing drawing..."
    );


    addLog(
        "Hex length: " +
        hexData.length
    );


    publishMessage(
        "DRAW:" + hexData
    );

}


// =====================================================
// START
// =====================================================

setStatus(false);

connectMQTT();

</script>

</body>

</html>
