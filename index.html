<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OLED Studio</title>

  <!-- MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f14;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    .status {
      background: #151b23;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid #293241;
    }

    #statusText {
      font-weight: bold;
    }

    .online {
      color: #22c55e;
    }

    .offline {
      color: #ef4444;
    }

    .card {
      background: #151b23;
      border: 1px solid #293241;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #0b0f14;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      margin: 5px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .heart {
      background: #e11d48;
    }

    .who {
      background: #7c3aed;
    }

    .draw {
      background: #059669;
    }

    #drawArea {
      display: none;
      text-align: center;
    }

    canvas {
      background: black;
      border: 2px solid #374151;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      height: 300px;
      touch-action: none;
      cursor: crosshair;
    }

    .draw-buttons {
      margin-top: 12px;
    }

    .clear {
      background: #dc2626;
    }

    .send {
      background: #16a34a;
    }

    .log {
      background: #080b0f;
      border-radius: 10px;
      padding: 12px;
      height: 130px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      color: #a7f3d0;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      margin-top: 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📺 OLED STUDIO</h1>

  <p class="subtitle">
    Control your OLED through MQTT
  </p>

  <!-- MQTT STATUS -->
  <div class="status">
    MQTT Status:
    <span id="statusText" class="offline">Connecting...</span>
  </div>

  <!-- TEXT -->
  <div class="card">

    <h2>📝 Display Text</h2>

    <input
      type="text"
      id="textInput"
      placeholder="Enter text for OLED"
      maxlength="80"
    >

    <div class="buttons">

      <button onclick="sendText()">
        📺 Show Text
      </button>

      <button class="heart" onclick="sendHeart()">
        ❤️ Heart
      </button>

      <button class="who" onclick="sendWho()">
        👤 Who Invented?
      </button>

    </div>

  </div>

  <!-- DRAW -->
  <div class="card">

    <h2>✏️ Draw</h2>

    <div class="buttons">
      <button class="draw" onclick="openDraw()">
        ✏️ Open Drawing
      </button>
    </div>

    <div id="drawArea">

      <br>

      <canvas id="canvas" width="500" height="300"></canvas>

      <div class="draw-buttons">

        <button class="clear" onclick="clearCanvas()">
          🗑 Clear
        </button>

        <button class="send" onclick="sendDrawing()">
          📺 Send Drawing
        </button>

      </div>

    </div>

  </div>

  <!-- LOG -->
  <div class="card">

    <h2>📡 MQTT Log</h2>

    <div id="log" class="log">
      Starting...
    </div>

  </div>

  <div class="footer">
    OLED Studio • ESP8266 + MQTT
  </div>

</div>


<script>

  /* ==========================================
     MQTT SETTINGS
     ========================================== */

  const MQTT_URL =
    "wss://broker.emqx.io:8084/mqtt";

  const MQTT_TOPIC =
    "sangeeth/oled-studio/test";


  /* ==========================================
     MQTT CLIENT
     ========================================== */

  const clientId =
    "OLED_WEB_" +
    Math.random().toString(16).substring(2, 10);

  const client =
    mqtt.connect(MQTT_URL, {
      clientId: clientId,
      clean: true,
      connectTimeout: 5000,
      reconnectPeriod: 3000
    });


  /* ==========================================
     ELEMENTS
     ========================================== */

  const statusText =
    document.getElementById("statusText");

  const logBox =
    document.getElementById("log");


  /* ==========================================
     LOG FUNCTION
     ========================================== */

  function log(message) {

    const time =
      new Date().toLocaleTimeString();

    logBox.innerHTML +=
      "<br>[" + time + "] " + message;

    logBox.scrollTop =
      logBox.scrollHeight;
  }


  /* ==========================================
     MQTT CONNECT
     ========================================== */

  client.on("connect", function () {

    statusText.textContent =
      "ONLINE";

    statusText.className =
      "online";

    log("MQTT connected");

    client.subscribe(
      MQTT_TOPIC,
      function(error) {

        if (error) {

          log("Subscribe error");

        } else {

          log(
            "Subscribed: " +
            MQTT_TOPIC
          );

        }

      }
    );

  });


  /* ==========================================
     MQTT ERROR
     ========================================== */

  client.on("error", function(error) {

    statusText.textContent =
      "ERROR";

    statusText.className =
      "offline";

    log(
      "MQTT error: " +
      error.message
    );

  });


  /* ==========================================
     MQTT OFFLINE
     ========================================== */

  client.on("offline", function() {

    statusText.textContent =
      "OFFLINE";

    statusText.className =
      "offline";

    log("MQTT offline");

  });


  /* ==========================================
     PUBLISH FUNCTION
     ========================================== */

  function publishMessage(message) {

    if (!client.connected) {

      alert("MQTT is not connected!");

      return;

    }

    client.publish(
      MQTT_TOPIC,
      message,
      {
        qos: 0
      },
      function(error) {

        if (error) {

          log(
            "Publish error"
          );

        } else {

          log(
            "Sent: " +
            message
          );

        }

      }
    );

  }


  /* ==========================================
     SHOW TEXT
     ========================================== */

  function sendText() {

    const text =
      document.getElementById(
        "textInput"
      ).value.trim();

    if (text === "") {

      alert("Enter some text first!");

      return;

    }

    publishMessage(
      "TEXT:" + text
    );

  }


  /* ==========================================
     HEART
     ========================================== */

  function sendHeart() {

    publishMessage(
      "HEART"
    );

  }


  /* ==========================================
     WHO INVENTED
     ========================================== */

  function sendWho() {

    publishMessage(
      "WHO"
    );

  }


  /* ==========================================
     DRAWING
     ========================================== */

  const canvas =
    document.getElementById(
      "canvas"
    );

  const ctx =
    canvas.getContext("2d");

  let drawing = false;


  function openDraw() {

    document.getElementById(
      "drawArea"
    ).style.display = "block";

  }


  function getPosition(event) {

    const rect =
      canvas.getBoundingClientRect();

    let clientX;
    let clientY;

    if (
      event.touches &&
      event.touches.length > 0
    ) {

      clientX =
        event.touches[0].clientX;

      clientY =
        event.touches[0].clientY;

    } else {

      clientX =
        event.clientX;

      clientY =
        event.clientY;

    }

    return {

      x:
        (clientX - rect.left) *
        (canvas.width / rect.width),

      y:
        (clientY - rect.top) *
        (canvas.height / rect.height)

    };

  }


  function startDrawing(event) {

    event.preventDefault();

    drawing = true;

    const pos =
      getPosition(event);

    ctx.beginPath();

    ctx.moveTo(
      pos.x,
      pos.y
    );

  }


  function draw(event) {

    if (!drawing)
      return;

    event.preventDefault();

    const pos =
      getPosition(event);

    ctx.lineWidth = 5;

    ctx.lineCap = "round";

    ctx.strokeStyle = "white";

    ctx.lineTo(
      pos.x,
      pos.y
    );

    ctx.stroke();

  }


  function stopDrawing() {

    drawing = false;

    ctx.closePath();

  }


  canvas.addEventListener(
    "mousedown",
    startDrawing
  );

  canvas.addEventListener(
    "mousemove",
    draw
  );

  canvas.addEventListener(
    "mouseup",
    stopDrawing
  );

  canvas.addEventListener(
    "mouseleave",
    stopDrawing
  );


  canvas.addEventListener(
    "touchstart",
    startDrawing,
    { passive: false }
  );

  canvas.addEventListener(
    "touchmove",
    draw,
    { passive: false }
  );

  canvas.addEventListener(
    "touchend",
    stopDrawing
  );


  /* ==========================================
     CLEAR DRAWING
     ========================================== */

  function clearCanvas() {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  /* ==========================================
     SEND DRAWING
     ========================================== */

  function sendDrawing() {

    /*
      For now we send a command.
      Later we will connect this
      to your NodeMCU OLED drawing
      function.
    */

    publishMessage(
      "DRAW"
    );

  }

</script>

</body>
</html>
