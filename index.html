<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OLED Studio</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:#080d13;
  color:#fff;
  padding:28px 18px;
}
.container{width:100%;max-width:1000px;margin:auto}
.card{
  background:#141d28;
  border:1px solid #202d3c;
  border-radius:22px;
  padding:28px;
  margin-bottom:22px;
  box-shadow:0 12px 35px rgba(0,0,0,.22);
}
.hero{text-align:center;padding:32px 20px}
h1{margin:0;font-size:42px;letter-spacing:.5px}
.subtitle{margin-top:8px;color:#9eb5d1;font-size:18px}
.status{
  margin-top:20px;
  display:inline-flex;
  align-items:center;
  gap:9px;
  font-weight:800;
  font-size:16px;
}
.dot{
  width:12px;height:12px;border-radius:50%;
  background:#777;box-shadow:0 0 10px rgba(255,255,255,.15);
}
.section-title{
  font-size:29px;
  margin:0 0 12px;
  font-weight:800;
}
.desc{color:#9eb5d1;font-size:17px;margin:0 0 22px}
input{
  width:100%;
  padding:18px 20px;
  border-radius:14px;
  border:1px solid #344354;
  background:#f7f7f7;
  color:#111;
  outline:none;
  font-size:18px;
}
input:focus{border-color:#6d94c7}
.input-row{display:flex;gap:12px;margin-bottom:14px}
button{
  border:0;
  border-radius:14px;
  min-height:58px;
  padding:14px 20px;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:.15s ease;
}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:active{transform:scale(.98)}
.send{background:#35445a;min-width:120px}
.text-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.show{background:#2864d7}
.slide{background:#7641e8}
.effects{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.heart{background:#ef2855}
.star{background:#dfa600}
.time{background:#ff9700}
.who{background:#7641e8}
.draw-card{padding-bottom:24px}
.canvas-wrap{
  width:100%;
  max-width:760px;
  margin:0 auto;
}
canvas{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:2/1;
  background:#000;
  border:2px solid #566579;
  border-radius:8px;
  image-rendering:pixelated;
  touch-action:none;
  cursor:crosshair;
}
.draw-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}
.clear{background:#35445a}
.send-drawing{background:#0ca77f}
.draw-status{
  min-height:22px;
  text-align:center;
  color:#9eb5d1;
  margin-top:10px;
}
.log-card{padding-bottom:24px}
.log{
  height:180px;
  overflow-y:auto;
  background:#05090d;
  border:1px solid #202d3c;
  border-radius:14px;
  padding:16px;
  font-family:Consolas,monospace;
  font-size:13px;
}
.log-line{margin-bottom:8px;color:#aebdca;word-break:break-word}
.note{
  text-align:center;
  color:#6f8298;
  font-size:12px;
  margin-top:12px;
}
@media(max-width:700px){
  h1{font-size:32px}
  .card{padding:20px}
  .text-grid,.effects,.draw-buttons{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
  body{padding:14px 10px}
  .input-row{flex-direction:column}
  .send{width:100%}
  .text-grid,.effects,.draw-buttons{grid-template-columns:1fr}
  .section-title{font-size:25px}
}
</style>
</head>

<body>
<div class="container">

  <section class="card hero">
    <h1>📺 OLED STUDIO</h1>
    <div class="subtitle">ESP8266 • MQTT • OLED Dashboard</div>
    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">CONNECTING...</span>
    </div>
  </section>

  <section class="card">
    <h2 class="section-title">📝 Display Text</h2>
    <p class="desc">Enter text and send it to the OLED.</p>

    <div class="input-row">
      <input id="textInput" type="text"
             placeholder="Enter text for OLED"
             maxlength="80">
      <button class="send" onclick="sendText()">SEND</button>
    </div>

    <div class="text-grid">
      <button class="show" onclick="sendText()">📺 SHOW TEXT</button>
      <button class="slide" onclick="sendSlide()">➡️ SLIDE TEXT</button>
    </div>
  </section>

  <section class="card">
    <h2 class="section-title">✨ OLED Effects</h2>
    <p class="desc">Send special displays directly to the OLED.</p>

    <div class="effects">
      <button class="heart" onclick="sendCommand('HEART')">❤️ HEART</button>
      <button class="star" onclick="sendCommand('STAR')">⭐ STAR</button>
      <button class="time" onclick="sendCommand('TIME')">🕒 TIME</button>
      <button class="who" onclick="sendCommand('WHO')">👤 WHO INVENTED?</button>
    </div>
  </section>

  <section class="card draw-card">
    <h2 class="section-title">🎨 Drawing</h2>
    <p class="desc">Draw anything and send it to the 128 × 64 OLED.</p>

    <div class="canvas-wrap">
      <canvas id="drawCanvas" width="128" height="64"></canvas>
    </div>

    <div class="draw-buttons">
      <button class="clear" onclick="clearCanvas()">CLEAR</button>
      <button class="send-drawing" onclick="sendDrawing()">SEND DRAWING</button>
    </div>

    <div id="drawStatus" class="draw-status"></div>
  </section>

  <section class="card log-card">
    <h2 class="section-title">📡 MQTT LOG</h2>
    <div id="logBox" class="log"></div>
  </section>

  <div class="note">OLED Studio • ESP8266 + MQTT + SH1106 128×64</div>
</div>

<script>
/* =========================================================
   MQTT SETTINGS
   These MUST match the ESP8266 .ino file.
   ========================================================= */
const MQTT_URL = "wss://broker.emqx.io:8084/mqtt";
const MQTT_TOPIC = "sangeeth/oled-studio/test";

let mqttClient = null;
let reconnectTimer = null;

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const logBox = document.getElementById("logBox");
const textInput = document.getElementById("textInput");
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d", {willReadFrequently:true});
const drawStatus = document.getElementById("drawStatus");

/* =========================================================
   LOG
   ========================================================= */
function addLog(message){
  const line = document.createElement("div");
  line.className = "log-line";
  line.textContent =
    "[" + new Date().toLocaleTimeString() + "] " + message;
  logBox.prepend(line);
}

/* =========================================================
   STATUS
   ========================================================= */
function setStatus(online, message){
  if(online){
    statusDot.style.background = "#00e676";
    statusDot.style.boxShadow = "0 0 10px #00e676";
    statusText.style.color = "#00e676";
    statusText.textContent = message || "ONLINE";
  }else{
    statusDot.style.background = "#ffab00";
    statusDot.style.boxShadow = "0 0 10px #ffab00";
    statusText.style.color = "#ffab00";
    statusText.textContent = message || "CONNECTING...";
  }
}

/* =========================================================
   MQTT CONNECTION
   ========================================================= */
function connectMQTT(){
  if(mqttClient && (mqttClient.connected || mqttClient.reconnecting)){
    return;
  }

  setStatus(false,"CONNECTING...");
  addLog("Connecting to MQTT broker...");

  const clientId =
    "OLED_WEB_" +
    Math.random().toString(16).slice(2) +
    "_" + Date.now();

  mqttClient = mqtt.connect(MQTT_URL,{
    clientId:clientId,
    clean:true,
    connectTimeout:8000,
    reconnectPeriod:3000,
    keepalive:30
  });

  mqttClient.on("connect",function(){
    setStatus(true,"ONLINE");
    addLog("MQTT connected.");

    mqttClient.subscribe(MQTT_TOPIC,function(error){
      if(error){
        addLog("Subscribe error: " + error.message);
      }else{
        addLog("Subscribed: " + MQTT_TOPIC);
      }
    });
  });

  mqttClient.on("reconnect",function(){
    setStatus(false,"RECONNECTING...");
    addLog("MQTT reconnecting...");
  });

  mqttClient.on("offline",function(){
    setStatus(false,"OFFLINE");
    addLog("MQTT offline.");
  });

  mqttClient.on("close",function(){
    setStatus(false,"OFFLINE");
  });

  mqttClient.on("error",function(error){
    setStatus(false,"MQTT ERROR");
    addLog("MQTT error: " + error.message);
  });

  mqttClient.on("message",function(topic,message){
    const text = message.toString();
    addLog("Received: " +
      (text.length > 100 ? "[DRAWING]" : text));
  });
}

/* =========================================================
   PUBLISH
   ========================================================= */
function publishMessage(message){
  if(!mqttClient || !mqttClient.connected){
    addLog("MQTT is not connected.");
    connectMQTT();
    return false;
  }

  mqttClient.publish(
    MQTT_TOPIC,
    message,
    {qos:0,retain:false},
    function(error){
      if(error){
        addLog("Publish error: " + error.message);
      }else{
        addLog(
          "Sent: " +
          (message.length > 100 ? "[DRAWING]" : message)
        );
      }
    }
  );

  return true;
}

/* =========================================================
   TEXT
   ========================================================= */
function sendText(){
  const text = textInput.value.trim();

  if(text === ""){
    addLog("Enter some text first.");
    textInput.focus();
    return;
  }

  publishMessage("TEXT:" + text);
}

function sendSlide(){
  const text = textInput.value.trim();

  if(text === ""){
    addLog("Enter some text first.");
    textInput.focus();
    return;
  }

  publishMessage("SLIDE:" + text);
}

function sendCommand(command){
  publishMessage(command);
}

/* =========================================================
   CANVAS
   ========================================================= */
function resetCanvas(){
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,128,64);

  ctx.strokeStyle = "#fff";
  ctx.fillStyle = "#fff";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
}

resetCanvas();

let drawing = false;

function getCanvasPosition(event){
  const rect = canvas.getBoundingClientRect();

  let clientX,clientY;

  if(event.touches && event.touches.length){
    clientX = event.touches[0].clientX;
    clientY = event.touches[0].clientY;
  }else{
    clientX = event.clientX;
    clientY = event.clientY;
  }

  const x = Math.max(
    0,
    Math.min(
      127,
      (clientX - rect.left) * 128 / rect.width
    )
  );

  const y = Math.max(
    0,
    Math.min(
      63,
      (clientY - rect.top) * 64 / rect.height
    )
  );

  return {x:x,y:y};
}

function startDrawing(event){
  event.preventDefault();
  drawing = true;

  const p = getCanvasPosition(event);

  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
  ctx.lineTo(p.x + 0.01,p.y + 0.01);
  ctx.stroke();
}

function draw(event){
  if(!drawing) return;

  event.preventDefault();

  const p = getCanvasPosition(event);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
}

function stopDrawing(event){
  if(event) event.preventDefault();
  drawing = false;
  ctx.beginPath();
}

canvas.addEventListener("mousedown",startDrawing);
canvas.addEventListener("mousemove",draw);
canvas.addEventListener("mouseup",stopDrawing);
canvas.addEventListener("mouseleave",stopDrawing);

canvas.addEventListener("touchstart",startDrawing,{passive:false});
canvas.addEventListener("touchmove",draw,{passive:false});
canvas.addEventListener("touchend",stopDrawing,{passive:false});
canvas.addEventListener("touchcancel",stopDrawing,{passive:false});

/* =========================================================
   CLEAR
   ========================================================= */
function clearCanvas(){
  resetCanvas();
  drawStatus.textContent = "Canvas cleared.";
  addLog("Canvas cleared.");
}

/* =========================================================
   CANVAS -> 2048 HEX CHARACTERS
   Format:
   128 x 64 = 8192 pixels
   16 bytes per row x 64 rows = 1024 bytes
   1024 bytes x 2 = 2048 HEX characters
   ========================================================= */
function getHexData(){
  const imageData = ctx.getImageData(0,0,128,64);
  let hex = "";

  for(let y=0;y<64;y++){
    for(let byteX=0;byteX<16;byteX++){
      let value = 0;

      for(let bit=0;bit<8;bit++){
        const x = byteX * 8 + bit;
        const index = (y * 128 + x) * 4;

        const r = imageData.data[index];
        const g = imageData.data[index + 1];
        const b = imageData.data[index + 2];

        const brightness = (r + g + b) / 3;

        if(brightness > 127){
          value |= (1 << bit);
        }
      }

      hex += value.toString(16).padStart(2,"0").toUpperCase();
    }
  }

  return hex;
}

/* =========================================================
   SEND DRAWING
   ========================================================= */
function sendDrawing(){
  const hexData = getHexData();

  if(hexData.length !== 2048){
    drawStatus.textContent = "Drawing conversion error.";
    addLog("Drawing conversion error.");
    return;
  }

  if(!mqttClient || !mqttClient.connected){
    drawStatus.textContent = "MQTT not connected.";
    addLog("Cannot send drawing: MQTT offline.");
    connectMQTT();
    return;
  }

  drawStatus.textContent = "Sending drawing...";
  addLog("Sending drawing (2048 HEX characters)...");

  mqttClient.publish(
    MQTT_TOPIC,
    "DRAW:" + hexData,
    {qos:0,retain:false},
    function(error){
      if(error){
        drawStatus.textContent = "Drawing send failed.";
        addLog("Drawing error: " + error.message);
      }else{
        drawStatus.textContent = "✓ Drawing sent to OLED";
        addLog("Drawing sent successfully.");
      }
    }
  );
}

/* =========================================================
   ENTER KEY
   ========================================================= */
textInput.addEventListener("keydown",function(event){
  if(event.key === "Enter"){
    sendText();
  }
});

/* =========================================================
   START
   ========================================================= */
setStatus(false,"CONNECTING...");
addLog("Starting OLED Studio...");
connectMQTT();
</script>
</body>
</html>
